server:
  port: 9090  # Порт, на котором будет работать приложение (например, http://localhost:9090)

spring.main.banner-mode: off
spring:

  datasource:
    url: jdbc:postgresql://localhost:7432/shareit_db  # URL подключения к PostgreSQL
    username: dbuser                                   # Имя пользователя БД
    password: chAd_mark-78                           # Пароль пользователя БД
    driver-class-name: org.postgresql.Driver         # JDBC‑драйвер для PostgreSQL

    initialization-mode: always  # Режим инициализации: всегда выполнять SQL‑скрипты при старте
                                 # Возможные значения: always, embedded, never

    hikari:                                             # Настройки пула соединений HikariCP
      maximum-pool-size: 20                       # Макс. число соединений в пуле (рекомендуется 10–20 для небольших приложений)
      idle-timeout: 30000                          # Время (мс), через которое неактивное соединение будет закрыто (30 сек)
      connection-timeout: 30000                   # Время ожидания получения соединения из пула (30 сек)
      leak-detection-threshold: 60000           # Время (мс) для обнаружения утечек соединений (60 сек)

  jpa:
    hibernate:
      ddl-auto: create-drop  # АВТОМАТИЧЕСКАЯ ГЕНЕРАЦИЯ СХЕМЫ БД
                                # Значения:
                                #   - create: создаёт схему при старте, НЕ удаляет при остановке
                                #   - update: обновляет схему, НЕ удаляет
                                #   - create-drop: создаёт при старте, УДАЛЯЕТ при остановке (идеально для тестов)
                                #   - none: не изменяет схему (ручное управление)
                                # Для разработки/тестов лучше create-drop; для продакшена — none или update


      format_sql: false           # Форматирует SQL‑запросы в логах (удобно для отладки)
      use_sql_comments: false      # Добавляет комментарии к SQL (например, имя метода репозитория)
      globally_quoted_identifiers: true  # Экранирует все идентификаторы в кавычки ("user"."name")
      globally_quoted_identifiers_skip_column_definitions: true  # Экранирование и для DDL (CREATE TABLE)

    properties:
      hibernate:
        format_sql: true        # Дублирует format_sql (на случай, если выше не сработало)
        dialect: org.hibernate.dialect.PostgreSQLDialect  # Диалект Hibernate для PostgreSQL
        show_sql: false          # Выводит SQL‑запросы в консоль (полезно для отладки)
        # Для более детального лога можно добавить:
        # hibernate.type.descriptor.sql.basicBinder.trace: true

  sql:
    init:
      mode: never
      platform: postgresql      # Платформа БД для скриптов (влияет на синтаксис)
      encoding: UTF-8            # Кодировка SQL‑файлов
      separator: ";"             # Разделитель SQL‑команд в скрипте
      data-locations: classpath:schema.sql  # Путь к SQL‑скрипту (можно указать несколько через запятую)
      continue-on-error: false  # Останавливать выполнение при первой ошибке
      fail-on-error: true      # Вызывать исключение, если скрипт не выполнился


logging:
  level:
    org:
      springframework: ERROR
      hibernate: ERROR
    ru:
      practicum:
        shareit: ERROR