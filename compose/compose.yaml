# описания сервисов (контейнеров), которые должны быть развёрнуты
services:

  gateway:
    build: /home/kerrigan_kein/yandex_praktikum/java-shareit/gateway  # Указывает путь к директории с Dockerfile для сборки образа gateway
    image: shareit-gateway  # Имя создаваемого/используемого образа контейнера
    container_name: shareit-gateway  # Явное задание имени контейнера (вместо стандартного генерируемого)
    ports:
      - "8080:8080"  #  # УБЕДИСЬ, что 8080 СВОБОДЕН на ХОСТЕ!!!!
    depends_on:
      - server  # Указывает, что контейнер gateway зависит от контейнера server (запускается после него)
    environment:
      - SHAREIT_SERVER_URL=http://server:9090  # Переменная окружения: URL сервера, к которому обращается gateway
    networks:
      - shareit-network
# Добавляем healthcheck, чтобы понимать, поднялся ли сервис
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # Даём приложению 60 с на старт перед первой проверкой
# Перезапускаем контейнер при падении
    restart: unless-stopped

  server:
    build: /home/kerrigan_kein/yandex_praktikum/java-shareit/server  # Путь к директории с Dockerfile для сборки образа server
    image: shareit-server  # Имя создаваемого/используемого образа контейнера
    container_name: shareit-server  # Явное имя контейнера
    ports:
      - "9090:9090"  # Проброс портов: внешний 9090 → внутренний 9090 контейнера
    depends_on:
      - db  # Контейнер server зависит от db (запускается после базы данных)
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/shareit_db  # URL БД для Spring-приложения
      - SPRING_DATASOURCE_USERNAME=dbuser  # Имя пользователя для подключения к БД
      - SPRING_DATASOURCE_PASSWORD=chAd_mark-78  # Пароль для подключения к БД
    networks:
      - shareit-network

  # описание контейнера db
  db: # имя сервиса
    # образ, из которого должен быть запущен контейнер
    image: postgres:16.1
    # имя, которое нужно присвоить контейнеру
    container_name: postgres-shareit
    # публикуемые порты
    ports:
      - "7432:5432"
    # настройки монтирования volume
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    # переменные окружения
    environment:
      - POSTGRES_DB=shareit_db
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=chAd_mark-78
    # описание способа проверки, что контейнер в рабочем состоянии
    healthcheck:
      # указываем, какую команду выполнить внутри контейнера для проверки его статуса
      # в этом примере вызывается утилита pg_isready, входящая в состав PostgreSQL
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      # через какое время после запуска начинать проверку
      timeout: 5s
      # интервал повторов проверки
      interval: 5s
      # количество попыток
      retries: 10
    networks:
      - shareit-network

# Явно определяем сеть для всех сервисов
networks:
  shareit-network:
    driver: bridge